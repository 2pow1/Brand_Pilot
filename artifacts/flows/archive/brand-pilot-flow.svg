<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="920" viewBox="0 0 1400 920">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 800 32px Arial, sans-serif; fill: #111827; }
      .section-title { font: 800 22px Arial, sans-serif; fill: #111827; }
      .section-desc { font: 500 16px Arial, sans-serif; fill: #475569; }
      .node { font: 700 17px Arial, sans-serif; fill: #111827; }
      .small { font: 500 14px Arial, sans-serif; fill: #475569; }
      .line { stroke: #334155; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .loop { stroke: #059669; stroke-width: 3; fill: none; marker-end: url(#arrow); stroke-dasharray: 8 6; }
    </style>
  </defs>

  <rect width="1400" height="920" fill="#ffffff"/>
  <text x="60" y="58" class="title">Brand Pilot: Instagram 카드뉴스 자동 게시 프로토타입 흐름</text>

  <rect x="55" y="95" width="1290" height="150" rx="18" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="85" y="130" class="section-title">1회 설정</text>
  <text x="85" y="156" class="section-desc">운영자/개발자가 처음만 수행하는 연결 및 템플릿 설정</text>

  <rect x="85" y="182" width="210" height="42" rx="10" fill="#ffffff" stroke="#4f46e5"/>
  <text x="104" y="209" class="node">브랜드 정보 등록</text>
  <rect x="325" y="182" width="245" height="42" rx="10" fill="#ffffff" stroke="#4f46e5"/>
  <text x="344" y="209" class="node">Instagram 계정 연결</text>
  <rect x="600" y="182" width="180" height="42" rx="10" fill="#ffffff" stroke="#4f46e5"/>
  <text x="621" y="209" class="node">Notion 연결</text>
  <rect x="810" y="182" width="190" height="42" rx="10" fill="#ffffff" stroke="#4f46e5"/>
  <text x="831" y="209" class="node">Discord 연결</text>
  <rect x="1030" y="182" width="270" height="42" rx="10" fill="#ffffff" stroke="#4f46e5"/>
  <text x="1050" y="209" class="node">카드뉴스 템플릿 설정</text>

  <path d="M295 203 H318" class="line"/>
  <path d="M570 203 H593" class="line"/>
  <path d="M780 203 H803" class="line"/>
  <path d="M1000 203 H1023" class="line"/>

  <rect x="55" y="290" width="1290" height="235" rx="18" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="85" y="326" class="section-title">반복 실행: AI 자동화</text>
  <text x="85" y="352" class="section-desc">캠페인마다 AI가 홍보 메시지, 카드뉴스 문구, 이미지 초안을 자동 생성</text>

  <rect x="85" y="382" width="195" height="58" rx="10" fill="#ffffff" stroke="#059669"/>
  <text x="110" y="407" class="node">캠페인 생성</text>
  <text x="112" y="427" class="small">또는 예약 실행</text>
  <rect x="315" y="382" width="220" height="58" rx="10" fill="#ffffff" stroke="#059669"/>
  <text x="343" y="407" class="node">GPT 메시지 생성</text>
  <text x="340" y="427" class="small">홍보 주제/관점</text>
  <rect x="570" y="382" width="245" height="58" rx="10" fill="#ffffff" stroke="#059669"/>
  <text x="600" y="407" class="node">5장 카드 문구 생성</text>
  <text x="615" y="427" class="small">후킹, 문제, 해결, CTA</text>
  <rect x="850" y="382" width="225" height="58" rx="10" fill="#ffffff" stroke="#059669"/>
  <text x="883" y="407" class="node">카드 이미지 생성</text>
  <text x="895" y="427" class="small">1080 x 1080</text>
  <rect x="1110" y="382" width="190" height="58" rx="10" fill="#ffffff" stroke="#059669"/>
  <text x="1137" y="407" class="node">초안 저장</text>
  <text x="1157" y="427" class="small">Notion</text>

  <path d="M280 411 H308" class="line"/>
  <path d="M535 411 H563" class="line"/>
  <path d="M815 411 H843" class="line"/>
  <path d="M1075 411 H1103" class="line"/>

  <rect x="590" y="465" width="250" height="42" rx="10" fill="#ffffff" stroke="#059669"/>
  <text x="622" y="492" class="node">Discord 검토 요청 전송</text>
  <path d="M1205 440 C1205 486 890 486 848 486" class="line"/>

  <rect x="55" y="570" width="565" height="185" rx="18" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="85" y="606" class="section-title">사람 검토</text>
  <text x="85" y="632" class="section-desc">매 캠페인마다 승인 또는 거절만 선택. 수정 루프는 없음</text>

  <polygon points="332,660 412,710 332,760 252,710" fill="#ffffff" stroke="#ea580c" stroke-width="2"/>
  <text x="293" y="716" class="node">승인?</text>
  <rect x="85" y="680" width="125" height="55" rx="10" fill="#ffffff" stroke="#ea580c"/>
  <text x="127" y="714" class="node">거절</text>
  <rect x="455" y="680" width="125" height="55" rx="10" fill="#ffffff" stroke="#ea580c"/>
  <text x="497" y="714" class="node">승인</text>

  <path d="M590 507 C430 535 332 595 332 651" class="line"/>
  <path d="M252 710 H217" class="line"/>
  <path d="M412 710 H448" class="line"/>

  <rect x="690" y="570" width="655" height="185" rx="18" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text x="720" y="606" class="section-title">자동 후처리</text>
  <text x="720" y="632" class="section-desc">승인되면 Instagram에 게시하고, 거절되면 게시하지 않고 기록만 남김</text>

  <rect x="720" y="680" width="180" height="55" rx="10" fill="#ffffff" stroke="#475569"/>
  <text x="740" y="704" class="node">공개 스토리지</text>
  <text x="763" y="724" class="small">이미지 업로드</text>
  <rect x="935" y="680" width="185" height="55" rx="10" fill="#ffffff" stroke="#475569"/>
  <text x="960" y="704" class="node">Instagram API</text>
  <text x="984" y="724" class="small">캐러셀 게시</text>
  <rect x="1155" y="680" width="155" height="55" rx="10" fill="#ffffff" stroke="#475569"/>
  <text x="1180" y="704" class="node">게시 완료</text>
  <text x="1196" y="724" class="small">Notion 기록</text>

  <rect x="720" y="785" width="220" height="55" rx="10" fill="#ffffff" stroke="#475569"/>
  <text x="753" y="809" class="node">거절 상태 기록</text>
  <text x="808" y="829" class="small">Notion</text>
  <rect x="1090" y="785" width="220" height="55" rx="10" fill="#ffffff" stroke="#475569"/>
  <text x="1135" y="809" class="node">다음 캠페인 대기</text>
  <text x="1168" y="829" class="small">반복 실행</text>

  <path d="M580 710 C630 710 664 708 713 708" class="line"/>
  <path d="M900 708 H928" class="line"/>
  <path d="M1120 708 H1148" class="line"/>
  <path d="M210 710 C430 760 590 812 713 812" class="line"/>
  <path d="M940 812 H1083" class="line"/>
  <path d="M1232 735 V778" class="line"/>

  <path d="M1200 840 C1200 885 183 885 183 448" class="loop"/>
  <text x="560" y="890" class="small">반복은 같은 콘텐츠 수정이 아니라, 다음 캠페인 생성으로 돌아가는 구조</text>
</svg>
