name: Brand Pilot Publish Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '11 * * * *'

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DATABASE_PROVIDER: supabase
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SCHEMA: public
      SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET || 'brand-pilot-instagram' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
      OPENAI_BASE_URL: https://api.openai.com/v1
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID || secrets.NOTION_DATABASE_ID }}
      NOTION_VERSION: 2026-03-11
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_APP_ID: ${{ secrets.META_APP_ID }}
      META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
      META_TOKEN_EXPIRY_WARNING_DAYS: ${{ vars.META_TOKEN_EXPIRY_WARNING_DAYS || '7' }}
      META_GRAPH_BASE_URL: https://graph.facebook.com/v25.0
      INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
      INSTAGRAM_PUBLISH_ENABLED: ${{ vars.INSTAGRAM_PUBLISH_ENABLED || 'false' }}
      BRAND_COMPANY_NAME: ${{ vars.BRAND_COMPANY_NAME || 'GrowthLine' }}
      BRAND_VOICE: ${{ vars.BRAND_VOICE || 'clear, practical, founder-friendly' }}
      BRAND_SERVICE_SUMMARY: ${{ vars.BRAND_SERVICE_SUMMARY || 'Branding and marketing support for small businesses.' }}
      BRAND_CTA_ENABLED: ${{ vars.BRAND_CTA_ENABLED || 'false' }}
      BRAND_CTA_LABEL: ${{ vars.BRAND_CTA_LABEL || '' }}
      BRAND_CTA_URL: ${{ vars.BRAND_CTA_URL || '' }}
      PLAYWRIGHT_BROWSERS_PATH: .cache/ms-playwright

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: .cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Show status
        run: node --no-warnings=ExperimentalWarning src/cli.js status

      - name: Generate approved channel payloads
        run: node --no-warnings=ExperimentalWarning src/cli.js channel generate --limit 3

      - name: Render Instagram card news
        run: node --no-warnings=ExperimentalWarning src/cli.js instagram render --limit 3

      - name: Upload Instagram artifacts
        run: node --no-warnings=ExperimentalWarning src/cli.js instagram upload --limit 3

      - name: Verify Instagram publish configuration
        if: ${{ env.INSTAGRAM_PUBLISH_ENABLED == 'true' }}
        run: node --no-warnings=ExperimentalWarning src/cli.js doctor publish

      - name: Publish Instagram posts
        if: ${{ env.INSTAGRAM_PUBLISH_ENABLED == 'true' }}
        run: node --no-warnings=ExperimentalWarning src/cli.js instagram publish --limit 3

      - name: Sync Notion mirror
        if: ${{ env.NOTION_TOKEN != '' && env.NOTION_DATA_SOURCE_ID != '' }}
        run: node --no-warnings=ExperimentalWarning src/cli.js notion sync --limit 10

      - name: Backup Notion artifact files
        if: ${{ env.NOTION_TOKEN != '' && env.NOTION_DATA_SOURCE_ID != '' }}
        run: node --no-warnings=ExperimentalWarning src/cli.js notion backup --limit 10

      - name: Cleanup backed-up Instagram artifacts
        if: ${{ env.NOTION_TOKEN != '' && env.NOTION_DATA_SOURCE_ID != '' }}
        run: node --no-warnings=ExperimentalWarning src/cli.js storage cleanup --confirm --limit 10
