name: Brand Pilot Scheduled Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DATABASE_PROVIDER: supabase
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SCHEMA: public
      SUPABASE_STORAGE_BUCKET: ${{ vars.SUPABASE_STORAGE_BUCKET || 'brand-pilot-instagram' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
      OPENAI_BASE_URL: https://api.openai.com/v1
      DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
      DISCORD_REVIEW_CHANNEL_ID: ${{ secrets.DISCORD_REVIEW_CHANNEL_ID }}
      DISCORD_BASE_URL: https://discord.com/api/v10
      NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID || secrets.NOTION_DATABASE_ID }}
      NOTION_VERSION: 2026-03-11
      META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
      META_GRAPH_BASE_URL: https://graph.facebook.com/v25.0
      INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Show status
        run: node --no-warnings=ExperimentalWarning src/cli.js status

      - name: Collect source candidates
        run: node --no-warnings=ExperimentalWarning src/cli.js collect --limit 3

      - name: Create drafts
        run: node --no-warnings=ExperimentalWarning src/cli.js draft --limit 3

      - name: Request Discord reviews
        run: node --no-warnings=ExperimentalWarning src/cli.js review request --limit 3

      - name: Generate approved channel payloads
        run: node --no-warnings=ExperimentalWarning src/cli.js channel generate --limit 3

      - name: Sync Notion mirror
        run: node --no-warnings=ExperimentalWarning src/cli.js notion sync --limit 10
